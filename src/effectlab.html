<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Effect Lab — Alight Motion → WebGL</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#0b0d14; --panel:#12151f; --line:#232838; --txt:#e7ebf5; --dim:#8b93ab;
    --acc:#5b8cff; --ok:#3ddc97; --err:#ff5c7a; --warn:#ffc53d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  body{display:flex;flex-direction:column}
  header{display:flex;gap:12px;align-items:center;padding:10px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:14px;margin:0;letter-spacing:.4px}
  header h1 b{color:var(--acc)}
  .pill{padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:11px}
  .pill.ok{color:var(--ok);border-color:#1d5c44}
  .pill.err{color:var(--err);border-color:#6d2233}
  button{background:#1a1f2d;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}
  button:hover{border-color:var(--acc);color:#fff}
  button.primary{background:var(--acc);border-color:var(--acc);color:#08101f;font-weight:700}
  main{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
  .stage{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  .canvases{flex:1;display:flex;gap:10px;padding:12px;align-items:flex-start;
    justify-content:center;flex-wrap:wrap;overflow:auto}
  .cell{display:flex;flex-direction:column;gap:6px;align-items:center}
  .cell span{font-size:11px;color:var(--dim)}
  canvas{background:
      linear-gradient(45deg,#161a26 25%,transparent 25%,transparent 75%,#161a26 75%),
      linear-gradient(45deg,#161a26 25%,#0e111a 25%,#0e111a 75%,#161a26 75%);
    background-size:16px 16px;background-position:0 0,8px 8px;
    border:1px solid var(--line);border-radius:4px;max-width:100%;height:auto}
  .bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;align-items:center}
  #status{font-size:12px;color:var(--dim)}
  #status.bad{color:var(--err)}
  #status.good{color:var(--ok)}
  aside{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
  .tabs button{font-size:11px;padding:3px 7px}
  .tabs button.on{background:var(--acc);color:#08101f;border-color:var(--acc)}
  .search{padding:8px;border-bottom:1px solid var(--line)}
  .search input{width:100%;background:#0d1018;border:1px solid var(--line);
    color:var(--txt);border-radius:6px;padding:6px 8px;font:inherit}
  #list{overflow:auto;flex:0 0 34%;border-bottom:1px solid var(--line)}
  .fx{display:flex;gap:8px;align-items:center;padding:5px 9px;cursor:pointer;
    border-bottom:1px solid #171b27}
  .fx:hover{background:#171c2a}
  .fx.on{background:#1d2740;box-shadow:inset 2px 0 0 var(--acc)}
  .fx img{width:26px;height:26px;object-fit:cover;border-radius:3px;background:#0d1018;flex:0 0 auto}
  .fx .ph{width:26px;height:26px;border-radius:3px;background:#1a1f2d;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
  .fx .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx .cat{font-size:10px;color:var(--dim)}
  .fx .dep{font-size:9px;color:var(--warn)}
  #params{overflow:auto;flex:1;padding:10px}
  #params h3{margin:2px 0 10px;font-size:13px;color:var(--acc)}
  .p{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;
    padding:5px 0;border-bottom:1px solid #171b27}
  .p label{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis}
  .p .ctl{display:flex;gap:6px;align-items:center;min-width:0}
  .p input[type=range]{flex:1;min-width:60px}
  .p input[type=number],.p input[type=text]{width:100%;background:#0d1018;
    border:1px solid var(--line);color:var(--txt);border-radius:4px;padding:3px 5px;font:inherit;font-size:12px}
  .p select{background:#0d1018;border:1px solid var(--line);color:var(--txt);
    border-radius:4px;padding:3px;font:inherit;font-size:12px;max-width:100%}
  .p input[type=color]{width:34px;height:22px;padding:0;border:1px solid var(--line);
    background:#0d1018;border-radius:4px;cursor:pointer}
  .p .val{font-size:11px;color:var(--dim);min-width:46px;text-align:right}
  .p .vec{display:flex;gap:4px;width:100%}
  .p .vec input{width:auto;flex:1;min-width:0}
  #console{height:120px;overflow:auto;padding:8px 10px;border-top:1px solid var(--line);
    background:#0a0c12;font-size:11px;white-space:pre-wrap;color:var(--dim)}
  #console .e{color:var(--err)}
  #console .g{color:var(--ok)}
  #console .w{color:var(--warn)}
  @media(max-width:960px){main{grid-template-columns:1fr}.stage{border-right:none}}
</style>
</head>
<body>
<header>
  <h1><b>ALIGHT MOTION</b> → WebGL Effect Lab</h1>
  <span class="pill" id="pCount">…</span>
  <span class="pill" id="pGL">…</span>
  <button id="verify">Verify semua effect</button>
  <button id="reroll">Acak</button>
  <button id="reset">Reset param</button>
</header>

<main>
  <section class="stage">
    <div class="canvases">
      <div class="cell"><canvas id="src" width="480" height="270"></canvas><span>input (content)</span></div>
      <div class="cell"><canvas id="out" width="480" height="270"></canvas><span id="outLabel">output</span></div>
    </div>
    <div class="bar">
      <button id="step" title="frame berikutnya">+1 frame</button>
      <label style="color:var(--dim);font-size:11px">acTime <input id="time" type="number" value="0" step="0.1" style="width:70px;background:#0d1018;border:1px solid var(--line);color:var(--txt);border-radius:4px;padding:3px"></label>
      <span id="status">memuat…</span>
    </div>
  </section>

  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="search"><input id="q" placeholder="cari effect… (blur, glow, chroma)"></div>
    <div id="list"></div>
    <div id="params"><h3>Pilih effect dulu</h3><div class="muted" style="color:var(--dim)">267 effect dari APK siap dijalankan di WebGL 1.</div></div>
    <div id="console">console…</div>
  </aside>
</main>

<script src="/glx.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const W = 480, H = 270;
let fx, inputTex, current = null, values = {}, timeVal = 0, cat = 'all';

function log(msg, cls){
  const el = $('console');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function status(msg, cls){ const s=$('status'); s.textContent=msg; s.className=cls||''; }

/* ---------------------------------------------------- test pattern (content) */
function buildInput(){
  const c = $('src'), g = c.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1b3a6b'); sky.addColorStop(.55,'#c46a3a'); sky.addColorStop(1,'#2a1730');
  g.fillStyle = sky; g.fillRect(0,0,W,H);
  // sun
  const rg = g.createRadialGradient(W*.72,H*.34,4,W*.72,H*.34,60);
  rg.addColorStop(0,'#fff7c2'); rg.addColorStop(1,'rgba(255,180,60,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(W*.72,H*.34,60,0,7); g.fill();
  // mountains
  g.fillStyle = '#101a2e';
  g.beginPath(); g.moveTo(0,H*.72); g.lineTo(W*.22,H*.44); g.lineTo(W*.42,H*.72); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(W*.3,H*.72); g.lineTo(W*.55,H*.5); g.lineTo(W*.8,H*.72); g.closePath(); g.fill();
  // checker corner (buat blur / pixelate keliatan)
  for(let y=0;y<4;y++) for(let x=0;x<6;x++){
    g.fillStyle = ((x+y)&1) ? '#f2f2f2' : '#101010';
    g.fillRect(8+x*14, H-70+y*14, 14, 14);
  }
  // colour bars
  ['#ff004d','#ffec27','#29adff','#7e2553','#00e436','#ff77a8'].forEach((c,i)=>{
    g.fillStyle=c; g.fillRect(W-92+i*14, H-70, 14, 42);
  });
  // alpha disc
  g.fillStyle='rgba(255,255,255,.85)';
  g.beginPath(); g.arc(64,64,34,0,7); g.fill();
  // text
  g.font='bold 44px system-ui,sans-serif'; g.textAlign='center';
  g.fillStyle='rgba(0,0,0,.55)'; g.fillText('ALIGHT', W/2+2, H*.3+2);
  g.fillStyle='#ffffff'; g.fillText('ALIGHT', W/2, H*.3);
  g.font='13px system-ui,sans-serif'; g.fillStyle='#cdd6ee';
  g.fillText('motion graphics · 480×270', W/2, H*.3+22);
  return c;
}

/* ------------------------------------------------------------------ params UI */
function fmtNum(v){
  if (typeof v === 'boolean') return v ? 'on':'off';
  if (Array.isArray(v)) return v.map(n=>typeof n==='number'?+n.toFixed(3):n).join(', ');
  if (typeof v === 'number') return String(+v.toFixed(4));
  return String(v);
}
function put(id, v){ values[id] = v; schedule(); }

function paramRow(p){
  const row = document.createElement('div'); row.className='p';
  const lab = document.createElement('label'); lab.textContent = p.label || p.id;
  lab.title = p.id + ' · ' + p.kind;
  const ctl = document.createElement('div'); ctl.className='ctl';
  row.appendChild(lab); row.appendChild(ctl);

  const setVal = v => put(p.id, v);

  switch(p.kind){
    case 'slider': case 'spinner': case 'float': {
      const min = Number.isFinite(p.min) ? p.min : 0;
      const max = Number.isFinite(p.max) ? p.max : Math.max(10, min+10);
      const rng = document.createElement('input');
      rng.type='range'; rng.min=min; rng.max=max;
      rng.step = (p.step && p.step>0) ? p.step : (max-min)/200;
      rng.value = values[p.id];
      const num = document.createElement('input');
      num.type='number'; num.step = rng.step; num.value = values[p.id];
      const lbl = document.createElement('span'); lbl.className='val'; lbl.textContent=fmtNum(values[p.id]);
      rng.oninput = ()=>{ num.value=rng.value; lbl.textContent=fmtNum(+rng.value); setVal(+rng.value); };
      num.onchange = ()=>{ const v=+num.value; rng.value=v; lbl.textContent=fmtNum(v); setVal(v); };
      ctl.append(rng,num,lbl);
      if (p.readonly) { rng.disabled = num.disabled = true; }
      break;
    }
    case 'selector': {
      const sel = document.createElement('select');
      (p.choices||[]).forEach(c=>{
        const o=document.createElement('option'); o.value=c.value; o.textContent=c.label;
        if (+c.value === +values[p.id]) o.selected = true;
        sel.appendChild(o);
      });
      if (!(p.choices||[]).length){
        const o=document.createElement('option'); o.value=values[p.id]; o.textContent=values[p.id]; sel.appendChild(o);
      }
      sel.onchange=()=>setVal(+sel.value);
      ctl.appendChild(sel);
      break;
    }
    case 'switch': {
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!values[p.id];
      cb.onchange=()=>setVal(cb.checked);
      const lbl=document.createElement('span'); lbl.className='val'; lbl.textContent=cb.checked?'on':'off';
      cb.onchange=()=>{ lbl.textContent=cb.checked?'on':'off'; setVal(cb.checked); };
      ctl.append(cb,lbl);
      break;
    }
    case 'color': {
      const v = values[p.id] || [1,1,1,1];
      const hex = '#'+[0,1,2].map(i=>Math.round(Math.min(1,Math.max(0,v[i]))*255)
                    .toString(16).padStart(2,'0')).join('');
      const c=document.createElement('input'); c.type='color'; c.value=hex;
      const a=document.createElement('input'); a.type='range'; a.min=0; a.max=1; a.step=.01; a.value=v[3];
      const lbl=document.createElement('span'); lbl.className='val'; lbl.textContent=fmtNum(v);
      const emit=()=>{ const r=parseInt(c.value.slice(1,3),16)/255,
        g=parseInt(c.value.slice(3,5),16)/255, b=parseInt(c.value.slice(5,7),16)/255;
        const nv=[r,g,b,+a.value]; lbl.textContent=fmtNum(nv); setVal(nv); };
      c.onchange=emit; a.oninput=emit;
      ctl.append(c,a,lbl);
      break;
    }
    case 'point': case 'xyz': {
      const n = p.kind==='point'?2:3;
      const v = values[p.id] || new Array(n).fill(0);
      const wrap=document.createElement('div'); wrap.className='vec';
      for(let i=0;i<n;i++){
        const inp=document.createElement('input'); inp.type='number'; inp.step='0.1'; inp.value=v[i];
        inp.onchange=()=>{ const nv=values[p.id].slice(); nv[i]=+inp.value; setVal(nv); };
        wrap.appendChild(inp);
      }
      ctl.appendChild(wrap);
      break;
    }
    case 'orient': {
      const s=document.createElement('span'); s.className='val';
      s.textContent='identity (mat4)'; ctl.appendChild(s);
      break;
    }
    default: {
      const inp=document.createElement('input'); inp.type='text'; inp.value=values[p.id];
      inp.onchange=()=>setVal(inp.value); ctl.appendChild(inp);
    }
  }
  return row;
}

function renderParams(){
  const box=$('params'); box.innerHTML='';
  if(!current){ box.innerHTML='<h3>Pilih effect dulu</h3>'; return; }
  const h=document.createElement('h3');
  h.textContent=current.name;
  box.appendChild(h);
  const d=document.createElement('div');
  d.style.cssText='color:var(--dim);font-size:11px;margin-bottom:10px';
  d.textContent=(current.desc||'(tanpa deskripsi)')+'  ·  '+current.id;
  box.appendChild(d);
  if(current.deprecated){
    const w=document.createElement('div'); w.className='pill err';
    w.style.cssText='display:inline-block;margin-bottom:8px';
    w.textContent='deprecated di APK'; box.appendChild(w);
  }
  if(current.experimental){
    const w=document.createElement('div'); w.className='pill';
    w.style.cssText='display:inline-block;margin:0 0 8px 6px;color:var(--warn)';
    w.textContent='experimental / 3D'; box.appendChild(w);
  }
  current.params.filter(p=>p.kind!=='texture').forEach(p=>box.appendChild(paramRow(p)));
}

/* ------------------------------------------------------------------- render */
let pending = null;
function schedule(){
  if (pending) return;
  pending = requestAnimationFrame(()=>{ pending=null; draw(); });
}

function draw(){
  if(!current) return;
  status('render '+current.file+' …');
  const t0 = performance.now();
  fx.render(current, {
    input: inputTex,
    values: values,
    width: W, height: H,
    time: timeVal
  }).then(res=>{
    fx.blit(res.texture, null, W, H);
    const ms = (performance.now()-t0).toFixed(1);
    const warn = res.warnings && res.warnings.length;
    status('✔ '+current.file+' · '+res.passes+' pass × '+res.iterations+' iter · '+ms+'ms'+
           (warn?' · '+warn+' warning':''), 'good');
    if (warn && !draw._w){ draw._w=1; log('contoh warning: '+res.warnings[0],'w'); }
  }).catch(err=>{
    status('✘ compile/run gagal: '+current.file, 'bad');
    log('── '+current.file+' ──','e');
    log(String(err.message||err), 'e');
  });
}

/* ------------------------------------------------------------------ browser */
function catList(){
  return fx.listByCategory();
}
function renderTabs(){
  const by=catList(), tabs=$('tabs'); tabs.innerHTML='';
  const mk=(id,label,n)=>{
    const b=document.createElement('button'); b.textContent=label+(n?' ('+n+')':'');
    if(id===cat) b.className='on';
    b.onclick=()=>{ cat=id; renderTabs(); renderList(); };
    tabs.appendChild(b);
  };
  const all = fx.fx.effects.length;
  mk('all','semua',all);
  Object.keys(by).sort().forEach(k=>mk(k,k,by[k].length));
}
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const by=catList();
  let items = cat==='all' ? fx.fx.effects : (by[cat]||[]);
  if(q) items = fx.fx.effects.filter(e=>
    (e.name+' '+e.id+' '+e.category+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q));
  const list=$('list'); list.innerHTML='';
  items.forEach(e=>{
    const row=document.createElement('div');
    row.className='fx'+(current&&current.file===e.file?' on':'');
    const vis = e.thumb
      ? `<img src="/webfx/${e.thumb}" loading="lazy" onerror="this.outerHTML='&lt;div class=ph&gt;FX&lt;/div&gt;'">`
      : '<div class="ph">FX</div>';
    row.innerHTML = vis +
      `<span class="nm">${e.name}${e.deprecated?' <span class=dep>dep</span>':''}</span>`+
      `<span class="cat">${e.category}</span>`;
    row.onclick=()=>select(e);
    list.appendChild(row);
  });
}
function select(e){
  current = e;
  values = {};
  e.params.forEach(p=>{ if(p.kind!=='texture') values[p.id]=p.default; });
  $('outLabel').textContent = 'output · '+e.file+' ('+e.shaders.length+' shader)';
  renderParams(); renderList(); draw();
}

/* ------------------------------------------------------------------ verify all */
async function verifyAll(){
  const btn=$('verify'); btn.disabled=true;
  const eff = fx.fx.effects;
  let ok=0, fail=0; const errs=[];
  status('compile '+eff.length+' effect…');
  for(let i=0;i<eff.length;i++){
    const e=eff[i];
    try{
      await fx.render(e,{input:inputTex,width:W,height:H,values:{}});
      ok++;
    }catch(err){
      fail++;
      errs.push(e.file+' :: '+String(err.message||err).split('\n').slice(0,2).join(' | '));
    }
    if((i%20)===0) status('compile '+eff.length+' effect… '+(i+1)+'/'+eff.length+
      '  ok='+ok+' fail='+fail);
  }
  btn.disabled=false;
  status('verify: '+ok+' OK / '+fail+' gagal dari '+eff.length,'good');
  log('══ verify all: '+ok+' OK, '+fail+' gagal ('+eff.length+' total)', fail?'e':'g');
  errs.slice(0,40).forEach(e=>log('  ✘ '+e,'e'));
}

/* ----------------------------------------------------------------------- boot */
(async function boot(){
  try{
    fx = new AMFX.Engine($('out'));
    $('pGL').textContent = 'WebGL 1 · '+(fx.highp?'highp':'mediump');
    $('pGL').className = 'pill ok';
    buildInput();
    inputTex = fx.textureFromCanvas($('src'), true);
    const meta = await fx.load('/webfx/effects.json');
    $('pCount').textContent = meta.count+' effect · '+meta.effects.reduce((a,e)=>a+e.params.length,0)+' param';
    $('pCount').className='pill ok';
    renderTabs(); renderList();
    $('q').oninput = renderList;
    $('verify').onclick = verifyAll;
    $('reset').onclick = ()=>{ if(current) select(current); };
    $('reroll').onclick = ()=>{
      const all=fx.fx.effects; select(all[(Math.random()*all.length)|0]);
    };
    $('step').onclick = ()=>{ timeVal = +(timeVal+1/30).toFixed(4); $('time').value=timeVal; draw(); };
    $('time').onchange = ()=>{ timeVal = +$('time').value||0; draw(); };
    status('siap · pilih effect di panel kanan','good');
    log('loaded '+meta.count+' effects, '+Object.keys(meta.byId).length+' id','g');
    // auto pick supaya langsung keliatan
    select(fx.effect('glow') || fx.fx.effects[0]);
  }catch(err){
    status('boot gagal: '+err.message,'bad');
    log(String(err.stack||err),'e');
  }
})();
})();
</script>
</body>
</html>
